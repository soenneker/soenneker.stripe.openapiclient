name: publish-package
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'test/**'

env:
    "PipelineEnvironment": true

permissions:
  contents: read
  id-token: write

jobs:
  publish-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Get release notes from latest commit
        uses: soenneker/release-notes-from-commits@v2

      
      - name: Setting up build version
        run: |
          version=$(($GITHUB_RUN_NUMBER))
          echo "BUILD_VERSION=4.0.$version" >> ${GITHUB_ENV}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Install dependencies with retry
        run: |
          retries=5
          base_wait_time=15
          exponent=2

          for i in $(seq 1 $retries); do
            if dotnet restore; then
              break
            fi

            if [ $i -lt $retries ]; then
              wait_time=$(awk "BEGIN {print int($base_wait_time * ($exponent ^ ($i - 1)))}")
              echo "dotnet restore failed, retrying in $wait_time seconds..."
              sleep $wait_time
            else
              echo "dotnet restore failed after $retries retries."
              exit 1
            fi
          done

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --project test/Soenneker.Stripe.OpenApiClient.Tests/Soenneker.Stripe.OpenApiClient.Tests.csproj --no-restore --verbosity normal

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output .

      - name: Log in to NuGet
        uses: soenneker/nuget-resilient-login@v6
        id: nuget-login
        with:
          user: soenneker

      - name: Publish to NuGet
        uses: soenneker/nuget-resilient-publish@v3
        with:
          api-key: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          packages: '**/*.nupkg'

      - name: Add GitHub NuGet Source
        run: |
          dotnet nuget add source https://nuget.pkg.github.com/soenneker/index.json \
            --name "github" \
            --username "any" \
            --password ${{ secrets.GH__TOKEN }} \
            --store-password-in-clear-text

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push ./*.nupkg \
            --source "github" \
            --api-key ${{ secrets.GH__TOKEN }}

      - name: Create GitHub Release
        run: |
          changelog="$PACKAGE_RELEASE_NOTES"
          tag_name="v$BUILD_VERSION"

          json_payload=$(
            jq -n \
              --arg tag_name "$tag_name" \
              --arg name "$tag_name" \
              --arg body "$changelog" \
              '{
                tag_name: $tag_name,
                name: $name,
                body: $body,
                draft: false,
                prerelease: false
              }'
          )

          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GH__TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d "$json_payload"
